schema: navsim_cluster_v1
execution:
  mode: formal
  expected_world_size: 16
  expected_local_world_size: 8
  backend: nccl
  timeout_s: 900
assets:
  fast_model: ${FAST_BASE_MODEL}
data:
  bundle: ${NAVSIM_MANIFEST_DIR}
  sensor_root: ${NAVSIM_SENSOR_ROOT}
  workers: 4
  prefetch_factor: 2
  normalization: full_train_fast
  validation_policy: official_default_train_val
processor:
  policy: original_pad
  pad_multiple: 32
  brightness: 0.0
  prompt_template: navsim_temporal_v1
model:
  init: pretrained
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_parameter_dtype: float32
  position_offset: 4096
  gradient_checkpointing: false
train:
  loss: official_unweighted_pose_l1
  arms:
  - fast_only
  seeds:
  - 42
  - 43
  epochs: 8
  micro_batch: 1
  gradient_accumulation: 2
  language_lr: 1.0e-05
  new_lr: 5.0e-05
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_fraction: 0.03
  minimum_lr_ratio: 0.1
  source_feedback: none
  evaluate_every_epochs: 1
  checkpoint_every_updates: 250
  keep_full_checkpoints: 2
evaluation:
  primary: val_ADE
  final_joint_modes:
  - correct
  - fixed
  fixed_source: lexicographically_first_train_token
reproducibility:
  deterministic_algorithms: true
  warn_only: false
  cublas_workspace_config: :4096:8
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: false
