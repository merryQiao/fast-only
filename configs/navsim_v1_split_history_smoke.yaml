schema: navsim_split_history_v2
execution:
  mode: smoke
  expected_world_size: 1
  expected_local_world_size: 1
  backend: nccl
  timeout_s: 180
assets:
  fast_model: models/Qwen3.5-0.8B
  slow_model: models/Qwen3.5-2B
data:
  bundle: outputs/slowfast_cluster/smoke_data
  sensor_root: data
  workers: 0
  prefetch_factor: 2
  normalization: full_train_per_model
  validation_policy: inherited_smoke_only
processor:
  policy: original_pad
  pad_multiple: 32
  brightness: 0.0
  prompt_template: navsim_temporal_v1
model:
  init: pretrained
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_parameter_dtype: float32
  position_offset: 4096
  gradient_checkpointing: false
  fast_image_frames: {fast_single: 1, fast_history: 4, slow_fast: 1}
  slow_image_frames: 4
source:
  init: pretrained
  seed: 142
  freeze_backbone: true
  train_new_modules: true
vision:
  fast_execution: per_frame
  runtime_history_cache: true
  runtime_cache_capacity: 8
train:
  loss: official_unweighted_pose_l1
  arms: [fast_single, fast_history, slow_fast]
  seeds: [42, 43]
  epochs: 1
  micro_batch: 1
  gradient_accumulation: 2
  language_lr: 0.00001
  new_lr: 0.00005
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_fraction: 0.03
  minimum_lr_ratio: 0.1
  source_feedback: completed_fast_detached
  kv_dropout: 0.3
  feedback_dropout: 0.1
  evaluate_every_epochs: 1
  checkpoint_every_updates: 250
  keep_full_checkpoints: 2
evaluation:
  primary: val_ADE
  final_joint_modes: [correct, fixed]
  fixed_source: lexicographically_first_train_token
reproducibility:
  deterministic_algorithms: true
  warn_only: false
  cublas_workspace_config: ':4096:8'
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: false
