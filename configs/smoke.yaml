seed: 42
smoke: true
smoke_max_windows: 16
device: cuda:0
bf16: true
cpu_threads: 4
output: outputs/fast_only/smoke
model:
  path: models/Qwen3.5-0.8B
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
processor:
  min_pixels: 16384
  max_pixels: 28672
data:
  train_manifest: outputs/fast_only/data/train.jsonl
  val_manifest: null
  stats: outputs/fast_only/data/stats.json
train:
  steps: 200
  microbatch: 1
  gradient_accumulation: 1
  lora_lr: 0.0001
  new_lr: 0.0005
  weight_decay: 0.01
  warmup_fraction: 0.03
  grad_clip: 1.0
  brightness: 0.0
  eval_every: 20
  checkpoint_every: 100
benchmark:
  warmup: 3
  repeats: 10
